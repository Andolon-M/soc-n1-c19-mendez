<!-- Configuracion centralizada FIM para grupo ubuntu-servidores (Bastion y Runners CI/CD) -->
<agent_config os="Linux">
  <syscheck>
    <disabled>no</disabled>
    <frequency>300</frequency>
    <scan_on_start>yes</scan_on_start>
    <directories check_all="yes" realtime="yes" report_changes="yes">/root/.aws,/home/*/.aws</directories>
    <directories check_all="yes" realtime="yes" report_changes="yes">/etc/ssh/sshd_config,/etc/sudoers,/etc/sudoers.d</directories>
    <directories check_all="yes" realtime="yes">/etc,/usr/bin,/usr/sbin</directories>
    <ignore>/etc/mtab</ignore>
  </syscheck>
</agent_config>